id: whale
title: Whale
family: whale
aliases: [simple whale]
categories: [animals/sea-life]
tags: [whale, sea, ocean, kite base, kids, quick, traditional]
difficulty: 1
description: A chunky whale with a flicked-up tail, made from the kite base in a few easy folds.
credits:
  designer: Traditional
  script: Origami project
materials:
  - id: paper
    size: 15
    diamond: true
    colors: { front: "#3a6ea5", back: "#fbf7ee" }
steps:
  - use: base/kite
  - text: Fold the top corner down so it lies over the flaps.
    fold: valley
    line: [KL, KR]
    move: A
  - text: Fold in half from left to right, so the flaps end up inside. Keep the flaps tucked flat against the body.
    mark: { HT: lerp(KL KR 0.5), TT: C }
    ops:
      - shape: [ { line: [C, KL], angle: 180 }, { line: [C, KR], angle: 180 }, { line: [KL, KR], angle: 180 } ]
      - fold: valley
        line: [lerp(KL KR 0.5), C]
        move: KL
  - text: Turn the model on its side.
    rotate: 90
  - text: Fold the tail up along a slanted line, through all the layers, so it points up past the back.
    tip: For a neater tail, crease this fold well, then open the body and wrap the tail around the outside instead (an outside reverse fold).
    pin: { BH: HT, BT: TT }
    fold: valley
    line: [lerp(C O 0.55), shift(lerp(C O 0.3) O C 2.4)]
    move: lerp(C O 0.03)
  - text: Stand the whale up on its belly.
    stand: [BH, lerp(BH BT 0.3)]
finish:
  camera: { azimuth: -20, elevation: 15, zoom: 1.1 }
  text: Draw an eye and a smile. Give the belly a firm crease so your whale stands up.
