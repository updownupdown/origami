id: elephant
title: Standing elephant
family: elephant
variant: Whole elephant
categories: [animals/mammals]
tags: [elephant, safari, two sheets, kids, traditional]
difficulty: 2
description: A whole elephant in two pieces. A sturdy triangle body with a little tail, and the big-eared elephant face with its trunk on top.
credits:
  designer: Traditional
  script: Origami project
materials:
  - id: body
    name: Body
    size: 15
    diamond: true
    at: [-12, 0]
    colors: { front: "#9aa3ad", back: "#e7e9ec" }
  - id: head
    name: Head
    size: 13
    diamond: true
    at: [10, 2]
    colors: { front: "#9aa3ad", back: "#e7e9ec" }
steps:
  - text: "Body: start with a diamond, white side up. Fold the top corner down to the bottom corner."
    fold: valley
    sheet: body
    line: [body.B, body.D]
    move: body.A
    pin: { SL: body.D, SR: body.B, SB: body.C, SM: body.O }
  - text: Fold the bottom point up on the front, and behind on the back, to make a white belly.
    pin:
      BL: intersect(lerp(SM SB 0.57) shift(lerp(SM SB 0.57) SM SB 1) SL SB)
      BR: intersect(lerp(SM SB 0.57) shift(lerp(SM SB 0.57) SM SB 1) SR SB)
    ops:
      - fold: valley
        sheet: body
        line: [BL, BR]
        move: lerp(SB SM 0.02)
        layers: top
      - fold: mountain
        sheet: body
        line: [BL, BR]
        move: lerp(SB SM 0.02)
  - text: Fold the back corner down through both layers to make a little tail.
    pin: { TQ: lerp(SR SL 0.165) }
    fold: valley
    sheet: body
    line: [TQ, shift(lerp(TQ SR 0.43) SL SR -1.26)]
    move: lerp(SR SL 0.02)
  - text: "Head: start with a diamond, white side up. Fold the top corner down to the bottom corner."
    fold: valley
    sheet: head
    line: [head.B, head.D]
    move: head.A
    pin: { HO: head.O, HC: head.C }
  - text: Fold in half and unfold to mark the centre.
    crease: valley
    sheet: head
    line: { bring: head.B, to: head.D }
    move: head.B
  - text: Fold the right and left corners down to make the big ears.
    ops:
      - fold: valley
        sheet: head
        line: [lerp(HO head.B 0.22), lerp(head.B HC 0.36)]
        move: head.B
      - fold: valley
        sheet: head
        line: [lerp(HO head.D 0.22), lerp(head.D HC 0.36)]
        move: head.D
  - text: Fold the bottom point up to the middle.
    fold: valley
    sheet: head
    line:
      through: lerp(HC HO 0.5)
      perpendicular: [HC, HO]
    move: HC
  - text: Fold it back down a little lower to make the trunk.
    fold: valley
    sheet: head
    line:
      through: lerp(HC HO 0.62)
      perpendicular: [HC, HO]
    move: lerp(HC HO 0.9)
    layers: top
  - text: Fold the top edge behind to round the head.
    fold: mountain
    sheet: head
    line:
      through: lerp(HO HC 0.1)
      perpendicular: [HC, HO]
    move: HO
  - text: Glue the head onto the front corner of the body.
    place: { sheet: head, point: lerp(HO HC 0.4), to: shift(lerp(SL SR 0.13) SL SR 1.0), layer: above }
  - text: Open the body a little and stand the elephant on its legs.
    ops:
      - shape: [ { line: [SL, TQ], angle: 145 } ]
      - stand: [BL, BR]
finish:
  camera: three-quarter
  text: Add two eyes above the trunk.
