id: swan
title: Swan
family: swan
categories: [animals/birds]
tags: [swan, bird, kite base, traditional]
difficulty: 2
description: The classic swan from the kite base, with a long neck and folded-down head.
credits:
  designer: Traditional
  script: Origami project
materials:
  - id: paper
    size: 15
    diamond: true
    colors: { front: "#fbf7ee", back: "#e6e1d6" }
steps:
  - use: base/kite
  - text: Turn the paper over.
    turn-over: true
  - text: Fold the right edge to the centre line again.
    fold: valley
    line:
      bring: [C, KR]
      onto: [C, A]
    move: KR
  - text: Fold the left edge to the centre line.
    fold: valley
    line:
      bring: [C, KL]
      onto: [C, A]
    move: KL
  - text: Fold the narrow point up to the top point.
    fold: valley
    line: { bring: C, to: A }
    move: C
    mark: { N: mid(C O) }
  - text: Fold the tip back down to make the head.
    fold: valley
    line:
      through: lerp(A O 0.22)
      perpendicular: [A, O]
    move: C
    layers: top
  - text: Fold in half behind along the centre line.
    fold: mountain
    line: [A, O]
    move: shift(O O A 0.8)
  - text: Turn the model so the body lies flat.
    rotate: 90
  - text: Pull the neck up and pinch it flat (outside reverse fold).
    reverse: outside
    line: [lerp(A O 0.55), shift(lerp(A O 0.25) A O 3)]
    move: lerp(A O 0.1)
finish:
  camera: three-quarter
  text: Your swan is ready to sail.
