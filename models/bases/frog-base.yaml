id: frog-base
title: Frog base
aliases: [lily base, iris base]
kind: base
categories: [bases]
difficulty: 4
description: A tall diamond with four long points and four small triangles, made from the preliminary base with four squash folds and four petal folds. The start of the lily, the iris and the frog.
credits:
  designer: Traditional
  script: Origami project
materials:
  - id: paper
    size: 15
    diamond: true
steps:
  - use: base/preliminary
  - text: "Squash fold. Lift the right-hand flap so it stands straight up, open it from the bottom, and press it flat so its folded edge lies on the centre line."
    points:
      PbcB: bisect(O mid(B C) B)
      PbcC: bisect(O mid(B C) C)
      PabA: bisect(O mid(A B) A)
      PabB: bisect(O mid(A B) B)
      PdaD: bisect(O mid(D A) D)
      PdaA: bisect(O mid(D A) A)
      PcdC: bisect(O mid(C D) C)
      PcdD: bisect(O mid(C D) D)
      QbcB: bisect(B O PbcB)
      QbcC: bisect(C O PbcC)
      QabA: bisect(A O PabA)
      QabB: bisect(B O PabB)
      QdaD: bisect(D O PdaD)
      QdaA: bisect(A O PdaA)
      QcdC: bisect(C O PcdC)
      QcdD: bisect(D O PcdD)
      RbcB: bisect(O B QbcB)
      RbcC: bisect(O C QbcC)
      RabA: bisect(O A QabA)
      RabB: bisect(O B QabB)
      RdaD: bisect(O D QdaD)
      RdaA: bisect(O A QdaA)
      RcdC: bisect(O C QcdC)
      RcdD: bisect(O D QcdD)
    refold:
      valley: [[O, C]]
      mountain: [[O, PbcC]]
      fold: [[O, PbcB]]
      flatten: [[O, mid(B C)]]
      arrow: [mid(B C), lerp(O C 0.70710678)]
    camera: { azimuth: -18, elevation: 52 }
  - text: "Petal fold. Lift the open edge of the flap you just flattened and swing it down, while the two sides fold in to the centre line. A small triangle ends up pointing down."
    refold:
      valley: [[QbcB, QbcC]]
      fold: [[QbcB, mid(B C)], [QbcC, mid(B C)], [B, QbcB], [C, QbcC]]
      flatten: [[QbcB, PbcB], [QbcC, PbcC]]
    camera: { azimuth: -18, elevation: 52 }
  - text: "Fold the right half of this face over to the left, like turning a page."
    refold:
      valley: [[O, mid(B C)]]
      flatten: [[O, B]]
    camera: { azimuth: -18, elevation: 52 }
  - text: "Squash fold the next flap the same way."
    refold:
      valley: [[O, B]]
      mountain: [[O, PabB]]
      fold: [[O, PabA]]
      flatten: [[O, mid(A B)]]
      arrow: [mid(A B), lerp(O B 0.70710678)]
    camera: { azimuth: -18, elevation: 52 }
  - text: "Petal fold it the same way."
    refold:
      valley: [[QabA, QabB]]
      fold: [[QabA, mid(A B)], [QabB, mid(A B)], [A, QabA], [B, QabB]]
      flatten: [[QabA, PabA], [QabB, PabB]]
    camera: { azimuth: -18, elevation: 52 }
  - text: Turn the model over.
    turn-over: vertical
  - text: "Squash fold the right-hand flap on this side."
    refold:
      valley: [[O, A]]
      mountain: [[O, PdaA]]
      fold: [[O, PdaD]]
      flatten: [[O, mid(D A)]]
      arrow: [mid(D A), lerp(O A 0.70710678)]
    camera: { azimuth: -18, elevation: 52 }
  - text: "Petal fold it."
    refold:
      valley: [[QdaD, QdaA]]
      fold: [[QdaD, mid(D A)], [QdaA, mid(D A)], [D, QdaD], [A, QdaA]]
      flatten: [[QdaD, PdaD], [QdaA, PdaA]]
    camera: { azimuth: -18, elevation: 52 }
  - text: "Fold the right half of this face over to the left."
    refold:
      valley: [[O, mid(D A)]]
      flatten: [[O, D]]
    camera: { azimuth: -18, elevation: 52 }
  - text: "Squash fold the last flap."
    refold:
      valley: [[O, D]]
      mountain: [[O, PcdD]]
      fold: [[O, PcdC]]
      flatten: [[O, mid(C D)]]
      arrow: [mid(C D), lerp(O D 0.70710678)]
    camera: { azimuth: -18, elevation: 52 }
  - text: "Petal fold it. This is the frog base."
    refold:
      valley: [[QcdC, QcdD]]
      fold: [[QcdC, mid(C D)], [QcdD, mid(C D)], [C, QcdC], [D, QcdD]]
      flatten: [[QcdC, PcdC], [QcdD, PcdD]]
    camera: { azimuth: -18, elevation: 52 }
