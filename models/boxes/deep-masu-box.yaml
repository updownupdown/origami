id: deep-masu-box
title: Deep masu box (cube)
family: masu
aliases: [cube box, tall masu, deep box, cube masu]
categories: [boxes/boxes]
tags: [box, masu, cube, deep, container, gift, traditional, 3d]
difficulty: 3
description: A masu folded in thirds instead of quarters. The walls are as tall as the base is wide, so you get a little open cube.
credits:
  designer: Traditional
  note: A deeper variation of the traditional masu, folded in thirds.
  script: Origami project
materials:
  - id: paper
    size: 15
    diamond: true
    colors: { front: "#3f8f8a", back: "#fbf7ee" }
steps:
  - text: Start with a diamond, white side up. Fold it in half edge to edge both ways, and unfold.
    pin:
      E: mid(O B)
      W: mid(O D)
      N: mid(O A)
      S: mid(O C)
      NE: mid(A B)
      SE: mid(B C)
      SW: mid(C D)
      NW: mid(D A)
      fNE: lerp(O NE 0.33333333)
      fSE: lerp(O SE 0.33333333)
      fSW: lerp(O SW 0.33333333)
      fNW: lerp(O NW 0.33333333)
      rEN: lerp(E NE 0.33333333)
      rES: lerp(E SE 0.33333333)
      rWN: lerp(W NW 0.33333333)
      rWS: lerp(W SW 0.33333333)
      tNE: lerp(N NE 0.33333333)
      tNW: lerp(N NW 0.33333333)
      tSE: lerp(S SE 0.33333333)
      tSW: lerp(S SW 0.33333333)
      kEN: lerp(B NE 0.33333333)
      kES: lerp(B SE 0.33333333)
      kWN: lerp(D NW 0.33333333)
      kWS: lerp(D SW 0.33333333)
    ops:
      - crease: valley
        line: [NE, SW]
        move: SE
      - crease: valley
        line: [NW, SE]
        move: NE
  - text: Fold the left and right corners to the centre, and unfold.
    ops:
      - crease: valley
        line: { bring: B, to: O }
        move: lerp(O B 0.9)
      - crease: valley
        line: { bring: D, to: O }
        move: lerp(O D 0.9)
  - text: Fold the top and bottom corners to the centre.
    ops:
      - fold: valley
        line: { bring: A, to: O }
        move: lerp(O A 0.9)
      - fold: valley
        line: { bring: C, to: O }
        move: lerp(O C 0.9)
  - text: Fold the top and bottom edges in a third of the way across, and unfold. Roll the paper loosely into three equal parts to find the spots first.
    ops:
      - crease: valley
        line: { bring: N, to: lerp(O S 0.33333333) }
        move: lerp(O N 0.9)
      - crease: valley
        line: { bring: S, to: lerp(O N 0.33333333) }
        move: lerp(O S 0.9)
  - text: Fold the left and right sides in a third of the way too, measuring from the creases of step 2, and unfold.
    ops:
      - crease: valley
        line: { bring: E, to: lerp(O W 0.33333333) }
        move: lerp(O E 0.9)
      - crease: valley
        line: { bring: W, to: lerp(O E 0.33333333) }
        move: lerp(O W 0.9)
  - text: Fold the left and right corners in a third of the way to the creases of step 2, and unfold.
    ops:
      - crease: valley
        line: { bring: B, to: lerp(B E 0.66666667) }
        move: lerp(E B 0.95)
      - crease: valley
        line: { bring: D, to: lerp(D W 0.66666667) }
        move: lerp(W D 0.95)
  - text: Lift the top and bottom sides along the creases so they stand straight up.
    shape:
      fixed: O
      creases:
        - { line: [kWN, kEN], kind: valley, angle: 94 }
        - { line: [kWS, kES], kind: valley, angle: 94 }
    camera: { azimuth: -30, elevation: 40 }
  - text: Raise the left and right ends. Push each corner in along its diagonal crease so it lies flat against the end wall.
    shape:
      fixed: O
      creases:
        - { line: [fNE, kEN], kind: valley, angle: 176 }
        - { line: [fSE, kES], kind: valley, angle: 176 }
        - { line: [fNW, kWN], kind: valley, angle: 176 }
        - { line: [fSW, kWS], kind: valley, angle: 176 }
        - { line: [tNE, tSE], kind: valley, angle: 90 }
        - { line: [tNW, tSW], kind: valley, angle: 90 }
        - { line: [fNE, NE], kind: mountain, angle: 176 }
        - { line: [fSE, SE], kind: mountain, angle: 176 }
        - { line: [fNW, NW], kind: mountain, angle: 176 }
        - { line: [fSW, SW], kind: mountain, angle: 176 }
        - { line: [NW, NE], angle: 176 }
        - { line: [SW, SE], angle: 176 }
    camera: { azimuth: -30, elevation: 40 }
  - text: Fold each end flap over the wall and down to the floor, so its point reaches the centre and locks the corners.
    shape:
      fixed: O
      creases:
        - { line: [rEN, rES], kind: valley, angle: 170 }
        - { line: [rEN, NE], kind: mountain, angle: 176 }
        - { line: [rES, SE], kind: mountain, angle: 176 }
        - { line: [rWN, rWS], kind: valley, angle: 170 }
        - { line: [rWN, NW], kind: mountain, angle: 176 }
        - { line: [rWS, SW], kind: mountain, angle: 176 }
        - { line: [kEN, kES], kind: mountain, angle: 100 }
        - { line: [kWN, kWS], kind: mountain, angle: 100 }
    camera: { azimuth: -30, elevation: 40 }
finish:
  camera: { azimuth: -30, elevation: 42, zoom: 1.5 }
  text: Press the edges crisp so the walls stand square. Two of these, one from slightly bigger paper, make a cube with a lid.
