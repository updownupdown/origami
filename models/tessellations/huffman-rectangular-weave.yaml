id: huffman-rectangular-weave
title: Huffman rectangular weave
family: weave
aliases: [rectangular weave, huffman weave, woven tessellation]
categories: [tessellations]
tags: [huffman, weave, tessellation, grid, geometric, 3d]
difficulty: 5
description: Pleats rise and dip past each other so the sheet looks like strips of paper woven over and under. One of the 3D tessellations of David Huffman, better known for Huffman coding.
credits:
  designer: David A. Huffman
  script: Origami project
materials:
  - id: paper
    size: 16
    start: front-up
    colors: { front: "#c8553d", back: "#fbf7ee" }
steps:
  - text: Crease a 16 by 16 grid. Make every line bend both ways.
    grid: { n: 16 }
  - text: Add the short diagonal creases at the corners of each strip, as mountains.
