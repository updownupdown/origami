id: waterbomb-tessellation
title: Waterbomb tessellation
family: waterbomb
aliases: [waterbomb tessellation, bubble tessellation, magic ball pattern]
categories: [tessellations]
tags: [waterbomb, tessellation, grid, bumpy, geometric]
difficulty: 3
description: Rows of little waterbomb bases, each row shifted half a step, pop up into a bumpy quilted surface. The same pattern rolled into a tube makes the magic ball.
credits:
  designer: Traditional
  script: Origami project
materials:
