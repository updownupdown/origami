id: resch-triangles
title: Resch triangle tessellation
family: resch
aliases: [ron resch pattern, resch pattern, triangle tessellation]
categories: [tessellations]
tags: [resch, triangle, tessellation, twist, geometric, textured]
difficulty: 4
description: Little three-pointed stars tuck under the paper and pull the sheet into a field of raised triangles. Ron Resch explored this pattern in the 1960s, and it still turns up in architecture and design.
credits:
  designer: Ron Resch
  script: Origami project
