id: miura-ori
title: Miura-ori
family: miura
aliases: [miura fold, map fold]
categories: [tessellations]
tags: [miura, tessellation, pleat, map, rigid folding, geometric, space]
difficulty: 3
description: Zigzag pleats crossed by straight pleats, so the whole sheet opens and closes in one smooth motion. It has folded solar panels for a satellite and makes a map that opens with one pull.
credits:
  designer: Koryo Miura
  script: Origami project
materials:
  - id: paper
    size: 18 x 16
    start: front-up
    colors: { front: "#e0a23a", back: "#fbf7ee" }
steps:
  - text: Crease the paper into 8 equal strips across. Halve it, halve the halves, then halve them again.
    grid: { n: 1, m: 8 }
  - text: Crease zigzag lines up the paper, alternating mountain and valley. Then fold every crease a little so the sheet starts to ripple.
    ops:
    - pattern:
        valley:
          - [paper(3.5 0), paper(4.5 2)]
          - [paper(4.5 2), paper(3.5 4)]
          - [paper(3.5 4), paper(4.5 6)]
