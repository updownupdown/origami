id: yoshimura-pattern
title: Yoshimura pattern
family: yoshimura
aliases: [diamond pattern, yoshimura buckling]
categories: [tessellations]
tags: [yoshimura, diamond, tessellation, cylinder, buckling, geometric]
difficulty: 3
description: Rows of diamonds that make a flat sheet curl into a ribbed arch. The same diamonds appear when a thin can is crushed from its ends.
credits:
  designer: Yoshimaru Yoshimura
  script: Origami project
materials:
  - id: paper
    size: 18 x 14
    start: front-up
    colors: { front: "#5b7fd6", back: "#fbf7ee" }
steps:
  - text: Crease the paper into 8 equal strips across, and make every crease bend both ways.
    grid: { n: 1, m: 8 }
  - text: Crease diagonals both ways through the strips so each strip becomes a row of triangles and the rows make diamonds.
    pattern:
      mountain:
        - [paper(0 10.5), paper(3 14)]
        - [paper(0 7), paper(6 14)]
        - [paper(0 3.5), paper(9 14)]
        - [paper(0 0), paper(12 14)]
        - [paper(3 0), paper(15 14)]
        - [paper(3 0), paper(0 3.5)]
        - [paper(6 0), paper(18 14)]
        - [paper(6 0), paper(0 7)]
        - [paper(9 0), paper(18 10.5)]
        - [paper(9 0), paper(0 10.5)]
        - [paper(12 0), paper(18 7)]
        - [paper(12 0), paper(0 14)]
        - [paper(15 0), paper(18 3.5)]
        - [paper(15 0), paper(3 14)]
        - [paper(18 0), paper(6 14)]
        - [paper(18 3.5), paper(9 14)]
        - [paper(18 7), paper(12 14)]
        - [paper(18 10.5), paper(15 14)]
  - text: Fold the diagonals as mountains and the straight creases as valleys, a little at a time. The sheet starts to curl.
    shape:
      fixed: paper(9 6.125)
      creases:
      - { line: [paper(0 10.5), paper(3 14)], kind: mountain, angle: 12 }
      - { line: [paper(0 7), paper(6 14)], kind: mountain, angle: 12 }
      - { line: [paper(0 3.5), paper(9 14)], kind: mountain, angle: 12 }
      - { line: [paper(0 0), paper(12 14)], kind: mountain, angle: 12 }
      - { line: [paper(3 0), paper(15 14)], kind: mountain, angle: 12 }
      - { line: [paper(3 0), paper(0 3.5)], kind: mountain, angle: 12 }
      - { line: [paper(6 0), paper(18 14)], kind: mountain, angle: 12 }
      - { line: [paper(6 0), paper(0 7)], kind: mountain, angle: 12 }
      - { line: [paper(9 0), paper(18 10.5)], kind: mountain, angle: 12 }
      - { line: [paper(9 0), paper(0 10.5)], kind: mountain, angle: 12 }
      - { line: [paper(12 0), paper(18 7)], kind: mountain, angle: 12 }
      - { line: [paper(12 0), paper(0 14)], kind: mountain, angle: 12 }
      - { line: [paper(15 0), paper(18 3.5)], kind: mountain, angle: 12 }
      - { line: [paper(15 0), paper(3 14)], kind: mountain, angle: 12 }
      - { line: [paper(18 0), paper(6 14)], kind: mountain, angle: 12 }
      - { line: [paper(18 3.5), paper(9 14)], kind: mountain, angle: 12 }
      - { line: [paper(18 7), paper(12 14)], kind: mountain, angle: 12 }
      - { line: [paper(18 10.5), paper(15 14)], kind: mountain, angle: 12 }
      - { line: [paper(0 1.75), paper(18 1.75)], kind: valley, angle: 5 }
      - { line: [paper(0 3.5), paper(18 3.5)], kind: valley, angle: 5 }
      - { line: [paper(0 5.25), paper(18 5.25)], kind: valley, angle: 5 }
      - { line: [paper(0 7), paper(18 7)], kind: valley, angle: 5 }
      - { line: [paper(0 8.75), paper(18 8.75)], kind: valley, angle: 5 }
      - { line: [paper(0 10.5), paper(18 10.5)], kind: valley, angle: 5 }
      - { line: [paper(0 12.25), paper(18 12.25)], kind: valley, angle: 5 }
  - text: Keep pushing the diamonds in. The rows shrink and the sheet curls into a ribbed arch.
    shape:
      fixed: paper(9 6.125)
      creases:
      - { line: [paper(0 10.5), paper(3 14)], kind: mountain, angle: 30 }
      - { line: [paper(0 7), paper(6 14)], kind: mountain, angle: 30 }
      - { line: [paper(0 3.5), paper(9 14)], kind: mountain, angle: 30 }
      - { line: [paper(0 0), paper(12 14)], kind: mountain, angle: 30 }
      - { line: [paper(3 0), paper(15 14)], kind: mountain, angle: 30 }
      - { line: [paper(3 0), paper(0 3.5)], kind: mountain, angle: 30 }
      - { line: [paper(6 0), paper(18 14)], kind: mountain, angle: 30 }
      - { line: [paper(6 0), paper(0 7)], kind: mountain, angle: 30 }
      - { line: [paper(9 0), paper(18 10.5)], kind: mountain, angle: 30 }
      - { line: [paper(9 0), paper(0 10.5)], kind: mountain, angle: 30 }
      - { line: [paper(12 0), paper(18 7)], kind: mountain, angle: 30 }
      - { line: [paper(12 0), paper(0 14)], kind: mountain, angle: 30 }
      - { line: [paper(15 0), paper(18 3.5)], kind: mountain, angle: 30 }
      - { line: [paper(15 0), paper(3 14)], kind: mountain, angle: 30 }
      - { line: [paper(18 0), paper(6 14)], kind: mountain, angle: 30 }
      - { line: [paper(18 3.5), paper(9 14)], kind: mountain, angle: 30 }
      - { line: [paper(18 7), paper(12 14)], kind: mountain, angle: 30 }
      - { line: [paper(18 10.5), paper(15 14)], kind: mountain, angle: 30 }
      - { line: [paper(0 1.75), paper(18 1.75)], kind: valley, angle: 11 }
      - { line: [paper(0 3.5), paper(18 3.5)], kind: valley, angle: 11 }
      - { line: [paper(0 5.25), paper(18 5.25)], kind: valley, angle: 11 }
      - { line: [paper(0 7), paper(18 7)], kind: valley, angle: 11 }
      - { line: [paper(0 8.75), paper(18 8.75)], kind: valley, angle: 11 }
      - { line: [paper(0 10.5), paper(18 10.5)], kind: valley, angle: 11 }
      - { line: [paper(0 12.25), paper(18 12.25)], kind: valley, angle: 11 }
finish:
  camera: three-quarter
  text: Roll it all the way round and join the ends for a twisting tube, the same pattern a crushed can makes.
