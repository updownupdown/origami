id: accordion-pleats
title: Accordion pleats
family: pleats
aliases: [fan, zigzag, pleat]
categories: [tessellations]
tags: [pleat, accordion, fan, beginner, tessellation]
difficulty: 1
description: Alternating valley and mountain folds stack the paper into a neat zigzag. Pleats are the first skill of every tessellation, and a fan when you pinch one end.
credits:
  designer: Traditional
  script: Origami project
materials:
  - id: paper
    size: 16
    start: front-up
    colors: { front: "#4a6fd8", back: "#fbf7ee" }
steps:
  - text: Crease the paper into eight equal strips. Fold in half, then each half in half, then each quarter in half.
    grid: { n: 8, m: 1 }
  - text: Fold the creases back and forth, valley then mountain, and squeeze them together.
    collapse:
      fixed: paper(1 8)
      valley:
      - [paper(2 0), paper(2 16)]
      - [paper(6 0), paper(6 16)]
      - [paper(10 0), paper(10 16)]
      - [paper(14 0), paper(14 16)]
      mountain:
      - [paper(4 0), paper(4 16)]
      - [paper(8 0), paper(8 16)]
      - [paper(12 0), paper(12 16)]
finish:
  camera: three-quarter
  text: Pinch one end and spread the other for a fan.
